services:
  - type: web
    name: trustvault
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString

databases:
  - name: trustvault-db
    plan: free
    databaseName: trustvault
    user: trustvault
